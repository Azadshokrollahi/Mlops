stages:
  prepare:
    cmd: python -m src.prepare
    deps: [src/prepare.py, data/raw/people_count.csv]
    outs: [data/processed/train.csv, data/processed/test.csv]
  train:
    cmd: python -m src.train
    deps: [src/train.py, data/processed/train.csv]
    params: [model.n_estimators, model.random_state]
    outs: [models/model.joblib]
  evaluate:
    cmd: python -m src.evaluate
    deps: [src/evaluate.py, data/processed/test.csv, models/model.joblib]
    metrics: [metrics/metrics.json]
